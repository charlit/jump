<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf6e3">
<title>Jump</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#222;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  #wrap{position:relative;height:100%;max-width:62vh;margin:0 auto}
  canvas{display:block;width:100%;height:100%}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(253,246,227,.94);color:#333;text-align:center;padding:16px}
  .hide{display:none!important}
  h1{margin:0;font-size:44px;letter-spacing:2px}
  .pets{display:flex;gap:14px}
  button{font:inherit;border:3px solid #333;border-radius:16px;background:#fff;padding:10px 18px;font-size:20px;font-weight:700;color:#333}
  .pet{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px}
  .pet canvas{width:110px;height:110px}
  .pet small{font-weight:400;font-size:13px;color:#777}
  p{margin:0;color:#555}
  #big{font-size:56px;font-weight:800}
  #reg{display:flex;gap:8px}
  input{font:inherit;font-size:18px;border:3px solid #333;border-radius:14px;padding:8px 12px;width:150px;-webkit-user-select:text;user-select:text}
  #reg button{font-size:16px;padding:8px 12px}
  #regMsg{color:#c0392b;min-height:1em}
  a{color:#333}
  ol{margin:0;padding:0 0 0 30px;text-align:left;font-size:18px;min-width:230px;max-height:55vh;overflow:auto}
  li{padding:3px 0}
  li.me{font-weight:800;color:#c0392b}
  #mute{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;font-size:18px;padding:4px 10px;border-width:2px;border-radius:12px;background:rgba(255,255,255,.8)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Couper le son">🔊</button>
  <div id="menu" class="ov">
    <h1>JUMP</h1>
    <div id="reg"><input id="nameIn" maxlength="12" placeholder="Ton pseudo" autocomplete="off"><button id="regBtn">S'enregistrer</button></div>
    <p id="hello" class="hide">Joueur : <b id="meName"></b> · <a href="#" id="logout">changer</a></p>
    <p id="regMsg"></p>
    <p>Choisis ton sauteur</p>
    <div class="pets">
      <button class="pet" data-pet="cat"><canvas width="220" height="220"></canvas>Polux<small>chat noir &amp; blanc</small></button>
      <button class="pet" data-pet="dog"><canvas width="220" height="220"></canvas>Rose<small>bouledogue français</small></button>
    </div>
    <button id="boardBtn">🏆 Scores</button>
    <p>Penche le téléphone ou touche à gauche / droite</p>
  </div>
  <div id="board" class="ov hide">
    <h1>🏆 Scores</h1>
    <ol id="boardList"></ol>
    <button id="boardClose">Retour</button>
  </div>
  <div id="over" class="ov hide">
    <h1 id="who"></h1>
    <p id="how">est tombé…</p>
    <div id="big">0</div>
    <p id="best"></p>
    <ol id="overList"></ol>
    <p id="overMsg"></p>
    <button id="again">Rejouer</button>
    <button id="change">Menu</button>
  </div>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const W = 400, GRAV = 0.35, JUMP = -11, SPRING = -18;
const LEVEL_MSG = ['', 'Ça accélère !', 'Plateformes fantômes !', 'Attention aux monstres !'];
let H, pet = 'cat', state = 'menu', P, plats, mons, pops, bonus, score, lastLevel, banner, best = 0, tilt = null, touchDir = 0, keys = {};
let me = null;
try { best = +localStorage.getItem('jump-best') || 0; me = JSON.parse(localStorage.getItem('jump-me')) } catch (e) {}
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

function resize() {
  const r = c.getBoundingClientRect(), d = devicePixelRatio || 1, s = r.width / W;
  H = r.height / s;
  c.width = r.width * d; c.height = r.height * d;
  g.setTransform(s * d, 0, 0, s * d, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- sprites ----------
function drawPet(ctx, kind, x, y, face, squash) {
  ctx.save(); ctx.translate(x, y); ctx.scale(face * (1 + squash * .25), 1 - squash * .25);
  ctx.lineWidth = 2; ctx.strokeStyle = '#222';
  const blob = (fill, bx, by, rx, ry) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke() };
  if (kind === 'cat') {
    // tail
    ctx.strokeStyle = '#111'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, 14); ctx.quadraticCurveTo(-30, 10, -24, -8); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = '#222';
    blob('#111', 0, 12, 15, 12);            // body
    blob('#fff', 3, 15, 7, 8);              // white chest
    blob('#fff', -8, 23, 5, 3); blob('#fff', 8, 23, 5, 3); // white paws
    // ears
    ctx.fillStyle = '#111';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 5, -18); ctx.lineTo(s * 16, -30); ctx.lineTo(s * 16, -12); ctx.fill(); }
    ctx.fillStyle = '#f4a3b4';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 9, -18); ctx.lineTo(s * 14.5, -26); ctx.lineTo(s * 14.5, -16); ctx.fill(); }
    blob('#111', 0, -10, 17, 14);           // head
    blob('#fff', 3, -4, 9, 7);              // white muzzle
    ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(3, -22); ctx.moveTo(6, -14); ctx.lineTo(3, -22); ctx.stroke(); // blaze
    for (const ex of [-5, 11]) { ctx.fillStyle = '#9be15d'; ctx.beginPath(); ctx.ellipse(ex, -12, 3.5, 4, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.fillRect(ex - .8, -15, 1.6, 6); }
    ctx.fillStyle = '#f4a3b4'; ctx.beginPath(); ctx.moveTo(1, -6); ctx.lineTo(5, -6); ctx.lineTo(3, -3.5); ctx.fill();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.beginPath();
    for (const s of [-1, 1]) { ctx.moveTo(3 + s * 7, -4); ctx.lineTo(3 + s * 20, -6); ctx.moveTo(3 + s * 7, -2); ctx.lineTo(3 + s * 20, 0); }
    ctx.stroke();
  } else {
    const fur = '#a0673c', dark = '#5b3822';
    ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14, 16); ctx.lineTo(-19, 12); ctx.stroke(); // stubby tail
    ctx.lineWidth = 2; ctx.strokeStyle = '#222';
    blob(fur, 0, 12, 17, 13);               // stocky body
    blob('#e9c9a6', 3, 15, 7, 8);           // light chest
    blob(fur, -9, 23, 5, 3); blob(fur, 9, 23, 5, 3);
    // bat ears
    for (const s of [-1, 1]) {
      ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(s * 13, -26, 7, 12, s * .35, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e59aa0'; ctx.beginPath(); ctx.ellipse(s * 13, -25, 3.5, 8, s * .35, 0, 7); ctx.fill();
    }
    blob(fur, 0, -10, 20, 15);              // wide head
    blob(dark, 3, -3, 11, 7);               // flat dark muzzle
    ctx.strokeStyle = dark; ctx.beginPath(); ctx.moveTo(-4, -20); ctx.quadraticCurveTo(2, -23, 8, -20); ctx.stroke(); // wrinkle
    for (const ex of [-7, 12]) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, -12, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(ex + .8, -12, 2.6, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(3, -7, 4.5, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ec6f86'; ctx.beginPath(); ctx.ellipse(5, 2, 3, 3.5, 0, 0, 7); ctx.fill(); // tongue
  }
  ctx.restore();
}
function drawMonster(m) {
  g.save(); g.translate(m.x, m.y); g.lineWidth = 2; g.strokeStyle = '#222';
  g.fillStyle = '#8e44ad'; g.beginPath(); g.ellipse(0, 0, 18, 15, 0, 0, 7); g.fill(); g.stroke();
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 8, -12); g.lineTo(s * 14, -22); g.lineTo(s * 15, -9); g.fill(); g.stroke(); } // horns
  for (const s of [-1, 1]) { g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 6, -3, 5, 0, 7); g.fill(); g.fillStyle = '#c0392b'; g.beginPath(); g.arc(s * 6, -2, 2.5, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-8, 6); for (let i = 0; i < 4; i++) { g.lineTo(-6 + i * 4, 11); g.lineTo(-4 + i * 4, 6); } g.fill();
  g.restore();
}
document.querySelectorAll('.pet canvas').forEach(cv => {
  const ctx = cv.getContext('2d'); ctx.scale(3.4, 3.4);
  drawPet(ctx, cv.parentNode.dataset.pet, 32, 36, 1, 0);
});

// ---------- sound (Web Audio, all synthesized, no files) ----------
let ac, master, musicGain, muted = false, musicTimer, step = 0, nextT = 0;
try { muted = localStorage.getItem('jump-mute') === '1' } catch (e) {}
function audio() { // must first run inside a tap (iOS/Android autoplay rules)
  if (!ac) {
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) return null;
    ac = new AC(); master = ac.createGain(); master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = .35; musicGain.connect(master);
  }
  master.gain.value = muted ? 0 : .5;
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f1, f2, dur, type = 'square', vol = .3, when = 0, out = master) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(v); v.connect(out); o.start(t); o.stop(t + dur + .02);
}
const arp = (notes, gap, type, vol) => notes.forEach((f, i) => tone(f, f, gap * 1.4, type, vol, i * gap));
const sfx = {
  jump: () => tone(320, 640, .12, 'square', .12),
  spring: () => tone(250, 1400, .35, 'square', .14),
  crack: () => tone(180, 60, .2, 'sawtooth', .2),
  treat: () => arp([880, 1320], .08, 'triangle', .3),
  shield: () => arp([523, 659, 784, 1047], .06, 'triangle', .25),
  rocket: () => tone(80, 400, 2.4, 'sawtooth', .12),
  stomp: () => tone(700, 120, .25, 'square', .18),
  hurt: () => tone(600, 80, .9, 'sawtooth', .22),
  fall: () => tone(500, 60, 1, 'triangle', .3),
  level: () => arp([523, 659, 784, 1047, 784, 1047], .1, 'square', .13),
};
const midi = m => 440 * 2 ** ((m - 69) / 12);
const MEL = [72, 0, 76, 79, 76, 0, 72, 74, 76, 0, 74, 72, 67, 0, 0, 0, 69, 0, 72, 76, 74, 0, 72, 69, 71, 0, 72, 74, 72, 0, 0, 0];
const BASS = [48, 48, 53, 55, 45, 53, 55, 48];
function schedule() {
  const len = .15 / Math.min(1 + level() * .05, 1.5); // eighth note, faster each level
  if (nextT < ac.currentTime) nextT = ac.currentTime + .05; // tab was throttled: don't burst
  while (nextT < ac.currentTime + .2) {
    const w = nextT - ac.currentTime, m = MEL[step % 32];
    if (m) tone(midi(m), midi(m), len * .9, 'square', .12, w, musicGain);
    if (step % 2 === 0) { const b = midi(BASS[(step >> 2) % 8]); tone(b, b, len * 1.6, 'triangle', .3, w, musicGain); }
    nextT += len; step++;
  }
}
function musicStart() { if (!audio() || musicTimer) return; step = 0; nextT = ac.currentTime + .1; musicTimer = setInterval(schedule, 50); }
function musicStop() { clearInterval(musicTimer); musicTimer = null; }
function showMute() { mute.textContent = muted ? '🔇' : '🔊'; }
mute.onclick = () => {
  muted = !muted; showMute();
  try { localStorage.setItem('jump-mute', muted ? '1' : '0') } catch (e) {}
  if (audio()) master.gain.value = muted ? 0 : .5;
};
showMute();
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

// ---------- game ----------
// one level per 1000 displayed points (score is in pixels, 10 px = 1 point)
const level = () => Math.floor(score / 10000);
const pts = () => Math.floor(score / 10) + bonus;
const ITEM = { rocket: '🚀', shield: '🛡️' };
// max 150 < jump height ~165 at any frame rate: always climbable
function gap() { return Math.min(150, 55 + level() * 14 + Math.random() * 20) }

function addPlat(y) {
  const L = level(), w = Math.max(44, 70 - L * 4);
  const type = L >= 2 && Math.random() < Math.min(.15 + (L - 2) * .05, .35) ? 'vanish'
    : Math.random() < Math.min(.12 + L * .1, .7) ? 'move' : 'norm';
  const p = { x: Math.random() * (W - w), y, w, type, vx: (Math.random() < .5 ? -1 : 1) * (1 + L * .4), spring: type !== 'vanish' && Math.random() < .07 };
  if (!p.spring && type !== 'vanish') {
    const r = Math.random(), shield = L >= 3 ? .035 : .01;
    p.item = r < .02 ? 'rocket' : r < .02 + shield ? 'shield' : r < .1 + shield ? 'treat' : null;
  }
  plats.push(p);
  // decoy breakable platform, never the only way up
  if (Math.random() < Math.min(.1 + L * .06, .4)) plats.push({ x: Math.random() * (W - w), y: y - 30 - Math.random() * 20, w, type: 'break' });
  if (L >= 3 && Math.random() < Math.min(.04 + (L - 3) * .02, .2))
    mons.push({ x: 30 + Math.random() * (W - 60), y: y - 70, vx: (Math.random() < .5 ? -1 : 1) * (.6 + L * .1) });
}

function start() {
  score = 0; bonus = 0; lastLevel = 0; banner = null; plats = []; mons = []; pops = [];
  P = { x: W / 2, y: H - 120, vx: 0, vy: JUMP, face: 1, squash: 0, dead: false, rocket: 0, shield: 0 };
  plats.push({ x: W / 2 - 35, y: H - 60, w: 70, type: 'norm' });
  let y = H - 60;
  while (y > -60) { y -= gap(); addPlat(y); }
  state = 'play';
  menu.classList.add('hide'); over.classList.add('hide');
  musicStart();
}

function gameOver() {
  state = 'over';
  musicStop(); if (!P.dead) sfx.fall();
  const s = pts();
  if (s > best) { best = s; try { localStorage.setItem('jump-best', best) } catch (e) {} }
  who.textContent = pet === 'cat' ? 'Polux' : 'Rose';
  how.textContent = P.dead ? 'a été attrapé par un monstre !' : pet === 'cat' ? 'est tombé…' : 'est tombée…';
  big.textContent = s; document.getElementById('best').textContent = 'Niveau ' + (level() + 1) + ' · Record : ' + best;
  overList.textContent = '';
  overMsg.textContent = me ? 'Envoi du score…' : 'Enregistre un pseudo au menu pour entrer au tableau des scores';
  (me ? api('scores', { name: me.name, token: me.token, score: s, pet }) : api('scores'))
    .then(list => { renderBoard(overList, list.slice(0, 5)); if (me) overMsg.textContent = '' },
      e => overMsg.textContent = e === 403 ? 'Pseudo inconnu : réenregistre-toi au menu' : 'Tableau des scores indisponible');
  over.classList.remove('hide');
}

function update(dt) {
  // horizontal control
  let dir = touchDir || (keys.ArrowLeft ? -1 : keys.ArrowRight ? 1 : 0);
  if (tilt !== null && !dir) P.vx = Math.max(-8, Math.min(8, tilt / 4));
  else P.vx += (dir * 0.8 - P.vx * 0.12) * dt;
  if (P.vx > .3) P.face = 1; else if (P.vx < -.3) P.face = -1;
  P.x += P.vx * dt;
  if (P.x < -20) P.x += W + 40; if (P.x > W + 20) P.x -= W + 40;

  const prevBottom = P.y + 24;
  P.vy += GRAV * dt;
  if (P.rocket > 0) { P.rocket -= dt; P.vy = -16; }
  if (P.shield > 0) P.shield -= dt;
  P.y += P.vy * dt;
  P.squash = Math.max(0, P.squash - .08 * dt);

  for (const p of plats) {
    if (p.type === 'move') { p.x += p.vx * dt; if (p.x < 0 || p.x > W - p.w) p.vx *= -1; }
    if (p.broken) { p.y += 6 * dt; continue; }
    if (!P.dead && P.vy > 0 && prevBottom <= p.y && P.y + 24 >= p.y && P.x + 12 > p.x && P.x - 12 < p.x + p.w) {
      if (p.type === 'break') { p.broken = true; sfx.crack(); continue; }
      if (p.type === 'vanish') p.gone = true;
      const springHit = p.spring && Math.abs(P.x - (p.x + p.w / 2)) < 16;
      P.vy = springHit ? SPRING : JUMP; P.y = p.y - 24; P.squash = 1;
      if (springHit) { buzz(20); sfx.spring(); } else sfx.jump();
    }
    if (p.item && !P.dead && Math.hypot(P.x - (p.x + p.w / 2), P.y - (p.y - 16)) < 30) {
      const pop = { x: p.x + p.w / 2, y: p.y - 30, t: 50 };
      if (p.item === 'rocket') { P.rocket = 150; pop.text = 'Fusée !'; sfx.rocket(); }
      else if (p.item === 'shield') { P.shield = 600; pop.text = 'Bouclier !'; sfx.shield(); }
      else { bonus += 100; pop.text = '+100'; sfx.treat(); }
      pops.push(pop); p.item = null; buzz(25);
    }
  }
  for (const m of mons) {
    m.x += m.vx * dt; if (m.x < 20 || m.x > W - 20) m.vx *= -1;
    if (!P.dead && Math.hypot(P.x - m.x, P.y - m.y) < 32) {
      if (P.vy > 0 && P.y < m.y - 4) { m.hit = true; P.vy = JUMP; P.squash = 1; buzz(30); sfx.stomp() } // stomp
      else if (P.rocket > 0) { m.hit = true; buzz(30); sfx.stomp() }
      else if (P.shield > 0) { m.hit = true; P.shield = 0; buzz(80); sfx.stomp() }
      else { P.dead = true; P.vy = Math.max(P.vy, 0); buzz(200); sfx.hurt() }
    }
  }

  // scroll camera
  const line = H * 0.4;
  if (P.y < line && !P.dead) {
    const d = line - P.y; P.y = line; score += d;
    for (const p of plats) p.y += d;
    for (const m of mons) m.y += d;
    for (const o of pops) o.y += d;
  }
  for (const o of pops) { o.t -= dt; o.y -= .5 * dt; }
  pops = pops.filter(o => o.t > 0);
  plats = plats.filter(p => !p.gone && p.y < H + 40);
  mons = mons.filter(m => !m.hit && m.y < H + 40);
  let top = Math.min(H, ...plats.filter(p => p.type !== 'break').map(p => p.y));
  while (top > -60) { top -= gap(); addPlat(top); }

  const L = level();
  if (L > lastLevel) { lastLevel = L; banner = { t: 150, a: 'Niveau ' + (L + 1), b: LEVEL_MSG[L] || 'Encore plus dur !' }; buzz(60); sfx.level(); }
  if (banner) banner.t -= dt;

  if (P.y > H + 40) gameOver();
}

function draw() {
  g.fillStyle = '#fdf6e3'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e9dfc4'; g.lineWidth = 1; g.beginPath();
  const off = (score || 0) % 20;
  for (let y = off; y < H; y += 20) { g.moveTo(0, y); g.lineTo(W, y); }
  for (let x = 0; x < W; x += 20) { g.moveTo(x, 0); g.lineTo(x, H); }
  g.stroke();
  if (!plats) return;
  for (const p of plats) {
    g.fillStyle = { break: '#b07b45', move: '#5aa9e6', vanish: '#fff' }[p.type] || '#6cc04a';
    g.strokeStyle = '#333'; g.lineWidth = 2;
    if (p.type === 'vanish') g.setLineDash([5, 4]);
    g.beginPath(); g.roundRect(p.x, p.y, p.w, 14, 7); g.fill(); g.stroke();
    g.setLineDash([]);
    if (p.type === 'break') { g.beginPath(); g.moveTo(p.x + 30, p.y); g.lineTo(p.x + 36, p.y + 7); g.lineTo(p.x + 32, p.y + 14); g.stroke(); }
    if (p.spring) { const sx = p.x + p.w / 2; g.fillStyle = '#ccc'; g.fillRect(sx - 7, p.y - 10, 14, 10); g.strokeRect(sx - 7, p.y - 10, 14, 10); }
    if (p.item) {
      g.font = '24px system-ui'; g.textAlign = 'center';
      g.fillText(ITEM[p.item] || (pet === 'cat' ? '🐟' : '🦴'), p.x + p.w / 2, p.y - 6 + Math.sin(performance.now() / 200) * 2);
    }
  }
  for (const m of mons) drawMonster(m);
  g.save(); g.translate(P.x, P.y); if (P.dead) g.rotate(Math.PI);
  if (P.rocket > 0) { // flame
    const f = 18 + Math.random() * 12;
    g.fillStyle = '#ff9f1a'; g.beginPath(); g.moveTo(-10, 22); g.lineTo(10, 22); g.lineTo(0, 22 + f); g.fill();
    g.fillStyle = '#ffe14d'; g.beginPath(); g.moveTo(-5, 22); g.lineTo(5, 22); g.lineTo(0, 22 + f * .6); g.fill();
  }
  drawPet(g, pet, 0, 0, P.face, P.squash);
  if (P.shield > 0 && (P.shield > 120 || Math.floor(P.shield / 8) % 2)) {
    g.fillStyle = 'rgba(90,169,230,.25)'; g.strokeStyle = '#5aa9e6'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, 34, 0, 7); g.fill(); g.stroke();
  }
  g.restore();
  g.textAlign = 'center'; g.font = 'bold 22px system-ui'; g.fillStyle = '#e67e22';
  for (const o of pops) { g.globalAlpha = Math.min(1, o.t / 20); g.fillText(o.text, o.x, o.y); }
  g.globalAlpha = 1;
  g.fillStyle = '#333'; g.font = 'bold 26px system-ui'; g.textAlign = 'left'; g.fillText(pts(), 14, 38);
  g.font = 'bold 18px system-ui'; g.textAlign = 'right'; g.fillText('Niv. ' + (level() + 1), W - 14, 36);
  if (banner && banner.t > 0) {
    g.globalAlpha = Math.min(1, banner.t / 30); g.textAlign = 'center';
    g.fillStyle = '#c0392b'; g.font = 'bold 40px system-ui'; g.fillText(banner.a, W / 2, H * .28);
    g.fillStyle = '#333'; g.font = 'bold 22px system-ui'; g.fillText(banner.b, W / 2, H * .28 + 34);
    g.globalAlpha = 1;
  }
}

let last = 0;
function loop(t) {
  const dt = Math.min((t - last) / 16.67, 3); last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- leaderboard ----------
// relative URL: works under /jump/ on the Mac mini; fails cleanly on static hosting
function api(path, body) {
  return fetch('api/' + path, body && { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status));
}
function renderBoard(el, list) {
  el.replaceChildren(...list.map(p => {
    const li = document.createElement('li');
    li.textContent = (p.pet === 'dog' ? '🐶 ' : '🐱 ') + p.name + ' — ' + p.score;
    if (me && p.name.toLowerCase() === me.name.toLowerCase()) li.className = 'me';
    return li;
  }));
  if (!list.length) el.textContent = 'Aucun score pour l\'instant';
}
function showMe() {
  reg.classList.toggle('hide', !!me); hello.classList.toggle('hide', !me);
  if (me) meName.textContent = me.name;
}
regBtn.onclick = async () => {
  const name = nameIn.value.trim();
  if (!name) { regMsg.textContent = 'Écris un pseudo'; return; }
  regMsg.textContent = '…';
  try {
    me = await api('register', { name });
    try { localStorage.setItem('jump-me', JSON.stringify(me)) } catch (e) {}
    regMsg.textContent = ''; showMe();
  } catch (e) { regMsg.textContent = e === 409 ? 'Ce pseudo est déjà pris' : 'Inscription indisponible'; }
};
nameIn.onkeydown = e => { if (e.key === 'Enter') regBtn.click(); };
logout.onclick = e => {
  e.preventDefault(); me = null;
  try { localStorage.removeItem('jump-me') } catch (e) {}
  showMe();
};
boardBtn.onclick = () => {
  board.classList.remove('hide'); boardList.textContent = 'Chargement…';
  api('scores').then(l => renderBoard(boardList, l), () => boardList.textContent = 'Tableau des scores indisponible');
};
boardClose.onclick = () => board.classList.add('hide');
showMe();

// ---------- input ----------
async function enableTilt() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission)
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    addEventListener('deviceorientation', e => { if (e.gamma !== null) tilt = e.gamma; });
  } catch (e) {}
}
document.querySelectorAll('.pet').forEach(b => b.onclick = () => { pet = b.dataset.pet; enableTilt(); start(); });
again.onclick = start;
change.onclick = () => { state = 'menu'; over.classList.add('hide'); menu.classList.remove('hide'); };
c.addEventListener('pointerdown', e => { const r = c.getBoundingClientRect(); touchDir = e.clientX - r.left < r.width / 2 ? -1 : 1; });
addEventListener('pointerup', () => touchDir = 0);
addEventListener('pointercancel', () => touchDir = 0);
addEventListener('keydown', e => keys[e.key] = true);
addEventListener('keyup', e => keys[e.key] = false);
</script>
